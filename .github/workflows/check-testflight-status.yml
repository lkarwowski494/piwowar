name: Check TestFlight Build Status (App Store Connect API)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Numer buildu do sprawdzenia (np. 1001)'
        required: false
        default: '1001'

permissions:
  contents: read

jobs:
  check-status:
    name: Query App Store Connect API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Query App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 || secrets.ASC_KEY_P8_BASE64 }}
          BUNDLE_ID: 'com.apps4craft.piwowar'
          BUILD_NUMBER: ${{ inputs.build_number || '1001' }}
        run: node scripts/ci/check-appstore-build.mjs
