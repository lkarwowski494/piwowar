name: CI Quality Gate (Verify)

on:
  push:
    branches: [main, remediation/*]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck & i18n Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run i18n Verification
        run: npm run check:i18n

      - name: Run TypeScript Typecheck
        run: npm run typecheck

  test-timezone-matrix:
    name: Jest Multi-Timezone (${{ matrix.timezone }})
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        timezone:
          - UTC
          - America/New_York
          - Asia/Tokyo
          - Europe/Warsaw
          - Pacific/Honolulu
          - Asia/Kathmandu
          - Australia/Sydney

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Unit & Regression Tests in ${{ matrix.timezone }}
        env:
          TZ: ${{ matrix.timezone }}
        run: npm test
